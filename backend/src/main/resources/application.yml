server:
  # Cloud platforms (Render/Railway) inject $PORT; 8080 is the local default.
  port: ${PORT:8080}

spring:
  application:
    name: customers-api

  datasource:
    # Local fallbacks let `mvn spring-boot:run` work against a local Postgres.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/customers}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # Fail fast locally, but tolerate slow cold starts on free cloud databases.
      initialization-fail-timeout: -1

  jpa:
    # `update` lets Hibernate create/evolve the `customers` table on first boot.
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: ${JPA_SHOW_SQL:false}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# CORS: comma-separated list of allowed origins, or "*" for any origin.
app:
  cors:
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: ${JPA_SHOW_SQL:false}
